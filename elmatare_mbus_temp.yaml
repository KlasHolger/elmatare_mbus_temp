# Kamstrup Omnipower M-Bus Reader with ESPHome External Component
# Version: 3.0.0 (2026-09-23)
# Author: Klas Jansson

esphome:
  name: elmatare-mbus-temp
#  friendly_name: Electricity Meter M-Bus Reader

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: latest
#  tillfogat 20260921
    advanced: 
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

# External component from GitHub
external_components:
  - source: github://KlasHolger/elmatare_mbus_temp@sater
    components: [mbus_reader]
# Force rebuild: 2026-09-07 20:40
    refresh: 0s

api:
#  encryption:
#    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "elmatare_mbus Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0

# Define UART first - this is required
uart:
  - id: uart_bus
    rx_pin:
      number: GPIO16
    baud_rate: 2400
    parity: NONE
    stop_bits: 1
    data_bits: 8

one_wire:
  - platform: gpio
    pin: GPIO18

sensor:
  - platform: dallas_temp
#    address: 0x8200000627eb1d28
    address: 0x374ba58b1d64ff28
    name: "Outdoor Temperature"
    id: outdoor_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - offset: -0.5
    update_interval: 60s

# M-Bus Reader component - top-level block provided by the external component
mbus_reader:
  uart_id: uart_bus

  wattage_sensor:
    name: "AMS Wattage"
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2

  reactive_power_sensor:
    name: "AMS Reactive Power"
    unit_of_measurement: "VAr"
    state_class: measurement
    accuracy_decimals: 2

  amperage_l1_sensor:
    name: "AMS Current L1"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  amperage_l2_sensor:
    name: "AMS Current L2"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  amperage_l3_sensor:
    name: "AMS Current L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  voltage_l1_sensor:
    name: "AMS Voltage L1"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0

  voltage_l2_sensor:
    name: "AMS Voltage L2"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0

  voltage_l3_sensor:
    name: "AMS Voltage L3"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0

  energy_sensor:
    name: "AMS Energy"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2

  reactive_energy_sensor:
    name: "AMS Reactive Energy"
    unit_of_measurement: "kVArh"
    state_class: total_increasing
    accuracy_decimals: 2
